  <style>
    :root {
      --bg: #090514;
      --card-bg: rgba(26, 16, 48, 0.85);
      --primary: #a855f7;
      --primary-glow: rgba(168, 85, 247, 0.45);
      --cyan: #06b6d4;
      --pink: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(147, 51, 234, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.18) 0%, transparent 45%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* PANTALLA DE CARGA (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b0a33 0%, #06020c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.6));
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 35px rgba(236, 72, 153, 0.8)); }
    }

    .splash-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
      margin-bottom: 8px;
    }

    .splash-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .loader-bar {
      width: 180px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899, #06b6d4);
      animation: loadingAnim 1.8s ease forwards;
    }

    @keyframes loadingAnim {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0); }
    }

    /* CONTENEDOR PRINCIPAL */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 5, 20, 0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-players {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    /* SELECTOR DE MODO */
    .nav-container {
      padding: 14px 16px 6px;
      display: flex;
      gap: 10px;
    }

    .btn-game {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-game.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.25));
      border-color: rgba(168, 85, 247, 0.6);
      color: #fff;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
    }

    /* SELECTOR DE INTENSIDAD */
    .level-container {
      padding: 6px 16px 14px;
      display: flex;
      gap: 8px;
    }

    .btn-level {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: #64748b;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-level.active-light {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--cyan);
      color: #38bdf8;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }
    .btn-level.active-fiesta {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--primary);
      color: #d8b4fe;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }
    .btn-level.active-hot {
      background: rgba(236, 72, 153, 0.2);
      border-color: var(--pink);
      color: #f472b6;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
    }

    /* TARJETA DE JUEGO */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 20px 30px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      min-height: 270px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
      border: 2px solid var(--primary);
      box-shadow: 0 15px 35px -10px var(--primary-glow);
      transition: transform 0.15s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-body {
      margin: 24px 0;
    }

    .card-prefix {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.45;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .card-footer {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-next {
      margin-top: 24px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      color: #fff;
      border: none;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px -5px var(--primary-glow);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .btn-next:active {
      transform: scale(0.97);
      filter: brightness(1.1);
    }

    /* MODAL DE PARTICIPANTES */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #150d27;
      border-radius: 24px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-head h3 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .btn-close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .player-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .player-form input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .player-form button {
      padding: 12px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .player-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn-del {
      background: none;
      border: none;
      color: #f43f5e;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

    const playerList = document.getElementById('playerList');
    const playerCount = document.getElementById('playerCount');

    function updateCard() {
      const list = DATA[currentGame][currentLevel];
      const text = list[currentIndex % list.length];
      const theme = themeColors[currentLevel];

      card.style.borderColor = theme.primary;
      card.style.boxShadow = `0 15px 35px -10px ${theme.glow}`;
      btnNext.style.background = theme.gradient;
      btnNext.style.boxShadow = `0 8px 25px -5px ${theme.glow}`;
      cardBadge.style.color = theme.primary;

      const titleMode = currentGame === 'yoNunca' ? '🍺 YO NUNCA' : '🎯 ¿QUIÉN ES MÁS PROBABLE?';
      cardBadge.innerText = `${titleMode} • ${currentLevel.toUpperCase()}`;

      if (currentGame === 'probable') {
        cardPrefix.style.display = 'block';
        cardFooter.innerHTML = '<span>👉 A la de 3, todos señalad a la vez</span>';
      } else {
        cardPrefix.style.display = 'none';
        cardFooter.innerHTML = '<span>🍻 Quien lo haya hecho, bebe un trago</span>';
      }

      cardText.innerText = text;
    }

    function nextCard() {
      const list = DATA[currentGame][currentLevel];
      currentIndex = (currentIndex + 1) % list.length;
      updateCard();
    }

    // MODOS
    btnYoNunca.addEventListener('click', () => {
      currentGame = 'yoNunca';
      btnYoNunca.classList.add('active');
      btnProbable.classList.remove('active');
      currentIndex = 0;
      updateCard();
    });

    btnProbable.addEventListener('click', () => {
      currentGame = 'probable';
      btnProbable.classList.add('active');
      btnYoNunca.classList.remove('active');
      currentIndex = 0;
      updateCard();
    });

    // NIVELES
    function resetLevelStyles() {
      btnLight.className = 'btn-level';
      btnFiesta.className = 'btn-level';
      btnHot.className = 'btn-level';
    }

    btnLight.addEventListener('click', () => {
      currentLevel = 'light';
      resetLevelStyles();
      btnLight.classList.add('active-light');
      currentIndex = 0;
      updateCard();
    });

    btnFiesta.addEventListener('click', () => {
      currentLevel = 'fiesta';
      resetLevelStyles();
      btnFiesta.classList.add('active-fiesta');
      currentIndex = 0;
      updateCard();
    });

    btnHot.addEventListener('click', () => {
      currentLevel = 'hot';
      resetLevelStyles();
      btnHot.classList.add('active-hot');
      currentIndex = 0;
      updateCard();
    });

    card.addEventListener('click', nextCard);
    btnNext.addEventListener('click', nextCard);

    // GESTIÓN JUGADORES
    function renderPlayers() {
      playerCount.innerText = players.length;
      playerList.innerHTML = '';
      players.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `<span>${p}</span><button class="btn-del" onclick="deletePlayer(${idx})">✕</button>`;
        playerList.appendChild(row);
      });
    }

    window.deletePlayer = function(i) {
      players.splice(i, 1);
      renderPlayers();
    };

    playerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = playerNameInput.value.trim();
      if (val) {
        players.push(val);
        playerNameInput.value = '';
        renderPlayers();
      }
    });

    btnPlayers.addEventListener('click', () => modal.style.display = 'flex');
    btnCloseModal.addEventListener('click', () => modal.style.display = 'none');

    // REGISTRO DE SERVICE WORKER PARA INSTALACIÓN PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // ANIMACIÓN SPLASH SCREEN (PANTALLA DE CARGA)
    window.addEventListener('DOMContentLoaded', () => {
      renderPlayers();
      updateCard();

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.visibility = 'hidden';
        }, 600);
      }, 1900);
    });
  </script>
</body>
</html>
