<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo degrade profundo -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="100%" stop-color="#07020d"/>
    </radialGradient>

    <!-- Gradiente neón principal -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Resplandor neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado estilo app icon -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Destellos decorativos de fondo -->
  <path d="M120 110 L130 130 L120 150 L110 130 Z" fill="#06b6d4" opacity="0.8"/>
  <path d="M390 100 L398 115 L390 130 L382 115 Z" fill="#ec4899" opacity="0.8"/>
  <circle cx="150" cy="380" r="6" fill="#a855f7" opacity="0.6"/>
  <circle cx="360" cy="390" r="8" fill="#06b6d4" opacity="0.6"/>

  <!-- Silueta de dos copas de fiesta brindando -->
  <g filter="url(#glow)">
    <!-- Copa izquierda inclinada -->
    <g transform="translate(230, 240) rotate(-18) translate(-230, -240)">
      <path d="M170 150 L230 220 V290 H210 V305 H250 V290 H230 V220 L290 150 Z" 
            stroke="url(#neonGrad)" stroke-width="12" stroke-linejoin="round" fill="rgba(168, 85, 247, 0.25)"/>
      <circle cx="230" cy="180" r="10" fill="#ec4899"/>
    </g>

    <!-- Copa derecha inclinada -->
    <g transform="translate(282, 240) rotate(18) translate(-282, -240)">
      <path d="M222 150 L282 220 V290 H262 V305 H302 V290 H282 V220 L342 150 Z" 
            stroke="url(#neonGrad)" stroke-width="12" stroke-linejoin="round" fill="rgba(6, 182, 212, 0.25)"/>
      <circle cx="282" cy="180" r="10" fill="#06b6d4"/>
    </g>

    <!-- Efecto choque/brindis (Chispa central) -->
    <path d="M256 160 L262 175 L277 181 L262 187 L256 202 L250 187 L235 181 L250 175 Z" fill="#ffffff"/>
  </g>

  <!-- Tipografía del Hashtag -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#neonGrad)">#LezaDeFiesta</text>
</svg>
